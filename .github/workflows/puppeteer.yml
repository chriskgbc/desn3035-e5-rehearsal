name: Puppeteer
on:
  workflow_run:
    workflows: ["Deploy Next.js site to Pages"]
    types:
      - completed    
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Testing
        run: echo "Hello world!"
      - name: Accessing GitHub files
        uses: actions/checkout@v4
      - name: Puppeteer launch
        run: npm i && node scripts/main.mjs
      - name: Fetch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: auto_*
